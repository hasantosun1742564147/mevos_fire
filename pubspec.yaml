name: mevos_fire
description: "MEVOS Fire - Yangin Hesap ve Standart Rehberi"
publish_to: 'none'
version: 2.0.0+12

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.2.3
  url_launcher: ^6.3.0
  http: ^1.2.2
  pdf: ^3.11.1
  excel: ^4.0.6
  share_plus: ^10.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/standartlar_db.json
    - assets/standartlar_en.json
    - assets/standartlar_de.json
    - assets/logo.png
    - assets/mevos_logo.png
    - assets/fonts/NotoSans-Regular.ttf
    - assets/fonts/NotoSans-Bold.ttf

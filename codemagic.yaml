workflows:
  ios-release:
    name: iOS Release Build
    max_build_duration: 60
    instance_type: mac_mini_m2

    # App Store Connect entegrasyonu Codemagic dashboard'dan eklendikten sonra
    # integrations:
    #   app_store_connect: My_ASC_Key

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: "com.mevos.fire"
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.mevos.fire

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true

    scripts:
      - name: Flutter sürümünü kontrol et
        script: flutter --version

      - name: Bağımlılıkları yükle
        script: flutter pub get

      - name: iOS bağımlılıklarını yükle
        script: find . -name "Podfile" -execdir pod install \;

      - name: Flutter testleri çalıştır
        script: flutter test
        ignore_failure: true

      - name: iOS IPA build al
        script: flutter build ipa --release

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

  ios-adhoc:
    name: iOS Ad Hoc Build (Cihaza Doğrudan)
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: ad_hoc
        bundle_identifier: com.mevos.fire

    scripts:
      - name: Flutter sürümünü kontrol et
        script: flutter --version

      - name: Bağımlılıkları yükle
        script: flutter pub get

      - name: iOS bağımlılıklarını yükle
        script: find . -name "Podfile" -execdir pod install \;

      - name: iOS IPA build al
        script: flutter build ipa --release

    artifacts:
      - build/ios/ipa/*.ipa
